name: Build Dylib

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile dylib for iOS
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib -arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=15.0 -framework Foundation -framework UIKit -o output.dylib tweak.mm

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: compiled-dylib
          path: output.dylib
